<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIND ESCAPE 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050816;color:white;font-family:Arial}
#hud{position:fixed;top:15px;left:15px;z-index:2}
#hud h2{color:#56eaff;margin:0 0 6px}
#controls{position:fixed;bottom:25px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;z-index:3}
#stick{width:125px;height:125px;border:2px solid #56eaff88;border-radius:50%;position:relative;background:#10213b99;touch-action:none}
#knob{width:48px;height:48px;border-radius:50%;background:#56eaff;position:absolute;left:36px;top:36px;box-shadow:0 0 20px #56eaff}
button{border:1px solid #56eaff;background:#10213b;color:white;border-radius:15px;padding:18px;font-size:15px}
#jump{height:65px;width:80px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#050816;z-index:5;color:#56eaff}
</style>
</head>
<body>
<div id="loading">INITIALIZING MIND ESCAPE...</div>
<div id="hud">
<h2>MIND ESCAPE 3D</h2>
<div>ROBOTIC WARRIOR | PROTOTYPE 01</div>
</div>
<div id="controls">
<div id="stick"><div id="knob"></div></div>
<button id="jump">JUMP</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050816);
scene.fog = new THREE.Fog(0x050816,15,65);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);
camera.position.set(0,5,9);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8bdfff,0x15152d,2));
const light = new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x10172a,roughness:0.85})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

const grid = new THREE.GridHelper(100,50,0x176b91,0x202d4a);
grid.position.y=0.02;
scene.add(grid);

function block(x,y,z,sx,sy,sz,color){
const m=new THREE.Mesh(
new THREE.BoxGeometry(sx,sy,sz),
new THREE.MeshStandardMaterial({color,metalness:0.65,roughness:0.3})
);
m.position.set(x,y,z);
scene.add(m);
return m;
}

// ROBOTIC WARRIOR
const robot = new THREE.Group();
scene.add(robot);

const armor = new THREE.MeshStandardMaterial({
color:0x52647d,metalness:0.85,roughness:0.25
});
const dark = new THREE.MeshStandardMaterial({
color:0x17243b,metalness:0.8,roughness:0.3
});
const energy = new THREE.MeshStandardMaterial({
color:0x36eaff,emissive:0x087cbb,emissiveIntensity:2
});

function part(parent,geo,mat,x,y,z){
const m=new THREE.Mesh(geo,mat);
m.position.set(x,y,z);
parent.add(m);
return m;
}

part(robot,new THREE.BoxGeometry(0.9,1.1,0.48),armor,0,1.65,0);
part(robot,new THREE.BoxGeometry(0.48,0.48,0.48),armor,0,2.5,0);
part(robot,new THREE.BoxGeometry(0.23,0.09,0.04),energy,0,2.52,-0.25);
part(robot,new THREE.BoxGeometry(0.35,0.35,0.16),energy,0,1.7,-0.28);

// Arms
part(robot,new THREE.BoxGeometry(0.27,0.95,0.3),dark,-0.68,1.6,0);
part(robot,new THREE.BoxGeometry(0.27,0.95,0.3),dark,0.68,1.6,0);

// Legs
part(robot,new THREE.BoxGeometry(0.34,0.85,0.4),armor,-0.25,0.55,0);
part(robot,new THREE.BoxGeometry(0.34,0.85,0.4),armor,0.25,0.55,0);

// World structures
block(-5,2,-9,2,4,2,0x18385b);
block(5,2,-13,2,4,2,0x30245b);
block(0,1,-20,8,2,1,0x123b50);
block(-9,1,-4,1,2,1,0x163b55);
block(9,1,-8,1,2,1,0x26365b);

let moveX=0,moveZ=0,velocityY=0,onGround=true;
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let active=false;

function joystick(e){
const r=stick.getBoundingClientRect();
const cx=r.left+r.width/2,cy=r.top+r.height/2;
let dx=e.clientX-cx,dy=e.clientY-cy;
const max=38,len=Math.hypot(dx,dy);
if(len>max){dx=dx/len*max;dy=dy/len*max;}
knob.style.left=(36+dx)+'px';
knob.style.top=(36+dy)+'px';
moveX=dx/max;
moveZ=dy/max;
}
stick.addEventListener('pointerdown',e=>{
active=true;stick.setPointerCapture(e.pointerId);joystick(e);
});
stick.addEventListener('pointermove',e=>{if(active)joystick(e);});
function resetStick(){
active=false;moveX=0;moveZ=0;
knob.style.left='36px';knob.style.top='36px';
}
stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

document.getElementById('jump').addEventListener('pointerdown',()=>{
if(onGround){velocityY=7;onGround=false;}
});

function animate(){
requestAnimationFrame(animate);
const speed=0.09;
robot.position.x+=moveX*speed;
robot.position.z+=moveZ*speed;

if(Math.abs(moveX)+Math.abs(moveZ)>0.1){
robot.rotation.y=Math.atan2(moveX,moveZ);
}

velocityY-=0.018;
robot.position.y+=velocityY*0.12;
if(robot.position.y<=0){
robot.position.y=0;velocityY=0;onGround=true;
}

camera.position.lerp(
new THREE.Vector3(robot.position.x,robot.position.y+5,robot.position.z+8),
0.08
);
camera.lookAt(robot.position.x,robot.position.y+1,robot.position.z);

renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
document.getElementById('loading').remove();
</script>
</body>
  </html>
